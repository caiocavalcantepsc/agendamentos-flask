<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}
    <title>Página renderizada</title>
    {% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="{{url_for('static', filename='media/favcom.ico')}}" type="image/x-icon">
</head>

    {% block body %}
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

    <div class="container shadow-lg p-4 rounded bg-white" style="max-width: 600px; height: 300px;">

        <div class="d-flex flex-column justify-content-center align-items-center h-100">

            <h1 class="text-center mb-4">
                Olá <strong>{{current_user.nome}}</strong>, seja bem vindo!
            </h1>

            <form action="{{ url_for('contato') }}" class="mb-3 ">
                <button class="btn btn-primary col-12">
                    Inserção de dados no BD
                </button>
            </form>

            <form action="{{ url_for('contatoLista') }}">
                <button  class="  btn btn-primary col-12 mb-3">
                    Items do Banco de dados
                </button>
            </form>

            <div class="d-flex gap-1">
                <span class="btn btn-dark d-inline bt-3">{{current_user.nome}} {{current_user.sobrenome}}</span>
                <form action="{{url_for('logout')}}">
                    <button class="btn btn-danger">Sair</button>
                </form>
            </div>

        </div>

    </div>

    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
